name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm FritchiiSetup.spec
      - name: Smoke test packaged resources
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'setup-smoke.json'
          $process = Start-Process -FilePath '.\dist\Fritchii-OOT-Setup.exe' -ArgumentList @('--self-test', $result) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or !(Test-Path -LiteralPath $result)) { throw 'Packaged self-test failed' }
          $data = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if (!$data.ok) { throw 'Packaged self-test returned failure' }
          $hash = (Get-FileHash -LiteralPath 'dist/Fritchii-OOT-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Fritchii-OOT-Setup.exe" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-setup
          path: |
            dist/Fritchii-OOT-Setup.exe
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/Fritchii-OOT-Setup.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title "Fritchii OOT Setup $env:GITHUB_REF_NAME" --notes "Single Windows setup file. Import your own NUP during installation. No ROM or saves included. See README for known rendering/performance limits."
